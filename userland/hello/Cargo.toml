# Standalone crate (own [workspace], not a member of the outer TuwaiqOS
# workspace) -- it targets the same "x86_64-unknown-none" string but is a
# fundamentally different kind of build: freestanding, statically linked,
# fixed-address ELF64 executables meant to be *loaded by* the kernel
# (kernel/src/elf.rs), not run on it. Keeping it out of the outer
# workspace's dependency/feature unification avoids any interference with
# the kernel's own build.
#
# `src/lib.rs` holds the shared syscall-ABI helper; each `src/bin/*.rs` is
# a separate real ELF64 executable (auto-discovered by cargo, no explicit
# [[bin]] needed) -- one well-behaved test program (`hello`) and five
# deliberately misbehaving ones (`bad_*`) proving the kernel's fault
# isolation for each required category (see kernel/src/interrupts.rs,
# kernel/src/syscall.rs).
[workspace]

[package]
name = "hello_user"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "hello_user"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1
